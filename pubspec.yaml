name: ludo_unbiased
description: "Ludo Unbiased: four-player Ludo with local, AI and LAN multiplayer."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  async: ^2.13.1
  clock: ^1.1.2
  collection: ^1.19.1
  flame: ^1.38.2
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  freezed_annotation: ^3.1.0
  go_router: ^17.5.0
  json_annotation: ^4.12.0
  meta: ^1.17.0
  shared_preferences: ^2.5.6

dev_dependencies:
  build_runner: ^2.15.1
  fake_async: ^1.3.3
  flame_test: ^2.3.1
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
  very_good_analysis: ^10.2.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/board/
    - assets/images/tokens/
    - assets/images/dice/
    - assets/images/cards/
    - assets/images/ui/
    - assets/images/fx/
    - assets/images/brand/
    - assets/icons/
    - assets/audio/
  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Fredoka-Bold.ttf
          weight: 700
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
